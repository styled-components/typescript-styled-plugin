version: 2
updates:
  # `/` covers .github/workflows only; the composite actions each need their own directory.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # .github/workflows/pullfrog.yml is maintained by the Pullfrog installer, which asks for no
    # edits, and pullfrog/pullfrog appears nowhere else. Its actions/checkout pin cannot be
    # excluded the same way without also ignoring the checkout the other workflows use.
    ignore:
      - dependency-name: pullfrog/pullfrog
  # Covers the pnpm-lock.yaml at the root and, through the pnpm workspace pnpm-workspace.yaml
  # declares, test/e2e's own package.json (docs/maintenance.md, project layout).
  # No cooldown key: Dependabot's default cooldown for version updates (3 days) already exceeds
  # pnpm-workspace.yaml's minimumReleaseAge (1440 minutes, one day), so a version pnpm would still
  # hold back never gets a version-update pull request. Security updates skip the cooldown, so
  # one for a version under a day old fails install until the age gate passes.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    # TypeScript versions move only as a deliberate, reviewed change. The plain `typescript`
    # dependency (package.json and test/e2e/package.json) compiles the package and runs the
    # default e2e pass, so every update to it is ignored here. The e2e matrix's
    # `npm:typescript@<version>` aliases in test/e2e/package.json need no entry: Dependabot's
    # npm and pnpm parser skips `npm:` alias requirements, so it never proposes updates for them.
    ignore:
      - dependency-name: typescript
