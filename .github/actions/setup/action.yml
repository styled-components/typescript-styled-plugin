name: Set up Node.js and dependencies
description: Installs pnpm and Node.js, optionally restores the pnpm store cache, and installs the locked dependencies. Runs after actions/checkout, which has to fetch this file first.

inputs:
  cache:
    description: Whether to restore and save the pnpm store cache.
    required: false
    default: 'true'
  node-version:
    description: Node.js version to install. Empty reads .github/.node-version, the development version.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # The pnpm version comes from package.json's packageManager field.
    - name: Install pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && '.github/.node-version' || '' }}
        package-manager-cache: false
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
